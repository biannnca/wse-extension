<div id="wse_settings" class="wse-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>WSE - 幕后世界模拟引擎</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="wse_enabled">
                <input id="wse_enabled" type="checkbox" />
                <span>启用 WSE 幕后模拟</span>
            </label>

            <hr class="sysHR" />

            <h4 class="wse-section-title">当前世界状态</h4>

            <div id="wse_status" class="wse-status-grid">
                <span class="wse-label">好感度</span>
                <span id="wse_status_affection">0</span>

                <span class="wse-label">堕落度</span>
                <span id="wse_status_corruption">0</span>

                <span class="wse-label">信任度</span>
                <span id="wse_status_trust">0</span>

                <span class="wse-label">已观测消息数</span>
                <span id="wse_status_messages">0</span>

                <span class="wse-label">聊天 ID</span>
                <span id="wse_status_chat">none</span>

                <span class="wse-label">最后更新时间</span>
                <span id="wse_status_updated">never</span>

                <span class="wse-label">状态标签</span>
                <span id="wse_status_flags">{}</span>
            </div>

            <div class="flex-container flexGap5 wse-actions">
                <div id="wse_trigger_manual" class="menu_button menu_button_icon" title="立即运行一次模拟">
                    <i class="fa-solid fa-play"></i>
                    <span>触发手动模拟</span>
                </div>
                <div id="wse_reset" class="menu_button menu_button_icon" title="重置当前聊天的 WSE 状态">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>重置模拟状态</span>
                </div>
            </div>

            <small id="wse_ui_feedback" class="wse-feedback"></small>
        </div>
    </div>
</div>
